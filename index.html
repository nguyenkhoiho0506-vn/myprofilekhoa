```html
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday 🎂</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    height: 100vh;
    background: radial-gradient(circle at center, #30145e, #09001a 75%);
    font-family: Arial, sans-serif;
    color: white;
}

/* Nền sao */
.stars {
    position: fixed;
    inset: 0;
    background-image:
        radial-gradient(white 1px, transparent 1px),
        radial-gradient(white 1px, transparent 1px);
    background-size: 80px 80px, 130px 130px;
    background-position: 0 0, 40px 60px;
    animation: starsMove 15s linear infinite;
    opacity: .6;
}

@keyframes starsMove {
    from { transform: translateY(0); }
    to { transform: translateY(-80px); }
}

/* Nội dung */
.container {
    position: relative;
    z-index: 5;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}

h1 {
    font-size: clamp(45px, 8vw, 90px);
    color: #fff;
    text-shadow:
        0 0 10px #ff4fd8,
        0 0 25px #ff4fd8,
        0 0 50px #7c4dff;
    animation: title 2s ease-in-out infinite alternate;
}

@keyframes title {
    from {
        transform: scale(1);
    }
    to {
        transform: scale(1.08);
    }
}

.name {
    margin-top: 15px;
    font-size: clamp(28px, 5vw, 55px);
    color: #ffd86b;
    text-shadow: 0 0 20px #ff9800;
    animation: glow 1.5s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 10px #ff9800; }
    to { text-shadow: 0 0 35px #ffeb3b; }
}

.message {
    margin-top: 20px;
    font-size: 20px;
    opacity: .9;
}

/* Bánh sinh nhật */
.cake {
    position: relative;
    width: 180px;
    height: 110px;
    margin-top: 35px;
}

.layer {
    position: absolute;
    bottom: 0;
    width: 180px;
    height: 70px;
    background: linear-gradient(#ff77b7, #ff3f91);
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(255, 50, 160, .5);
}

.cream {
    position: absolute;
    top: 25px;
    width: 180px;
    height: 25px;
    background: #fff;
    border-radius: 50%;
}

.candle {
    position: absolute;
    width: 14px;
    height: 45px;
    background: repeating-linear-gradient(
        45deg,
        #fff,
        #fff 5px,
        #5ce1ff 5px,
        #5ce1ff 10px
    );
    top: -20px;
    left: 83px;
    border-radius: 5px;
}

/* Ngọn lửa */
.flame {
    position: absolute;
    top: -43px;
    left: 82px;
    width: 17px;
    height: 25px;
    background: #ffdf00;
    border-radius: 50% 50% 50% 50%;
    box-shadow: 0 0 20px #ff9800;
    animation: flame 0.4s infinite alternate;
}

@keyframes flame {
    from {
        transform: scale(.8) rotate(-5deg);
    }
    to {
        transform: scale(1.1) rotate(5deg);
    }
}

/* Bóng bay */
.balloon {
    position: absolute;
    width: 55px;
    height: 70px;
    border-radius: 50%;
    animation: float 5s ease-in-out infinite;
}

.balloon::after {
    content: "";
    position: absolute;
    width: 2px;
    height: 100px;
    background: white;
    left: 50%;
    top: 68px;
}

.b1 {
    background: #ff4d6d;
    left: 8%;
    top: 30%;
}

.b2 {
    background: #4dd9ff;
    right: 10%;
    top: 25%;
    animation-delay: 1s;
}

.b3 {
    background: #ffe14d;
    left: 18%;
    bottom: 15%;
    animation-delay: 2s;
}

.b4 {
    background: #b84dff;
    right: 20%;
    bottom: 12%;
    animation-delay: 3s;
}

@keyframes float {
    0%, 100% {
        transform: translateY(0) rotate(-5deg);
    }
    50% {
        transform: translateY(-35px) rotate(5deg);
    }
}

/* Nút */
button {
    margin-top: 30px;
    padding: 14px 28px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(90deg, #ff4fd8, #7c4dff);
    color: white;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 0 20px #ff4fd8;
    transition: .3s;
}

button:hover {
    transform: scale(1.1);
    box-shadow: 0 0 40px #ff4fd8;
}

/* Pháo hoa */
.firework {
    position: absolute;
    width: 5px;
    height: 5px;
    background: white;
    border-radius: 50%;
    animation: explode 1.5s ease-out forwards;
}

@keyframes explode {
    0% {
        transform: scale(1);
        opacity: 1;
        box-shadow: 0 0 5px white;
    }

    100% {
        transform: scale(25);
        opacity: 0;
        box-shadow:
            40px 0 #ff4d6d,
            -40px 0 #4dd9ff,
            0 40px #ffe14d,
            0 -40px #b84dff,
            30px 30px #ff66cc,
            -30px -30px #66ffff,
            30px -30px #ffff66,
            -30px 30px #cc66ff;
    }
}

/* Tim bay */
.heart {
    position: absolute;
    color: #ff5caa;
    font-size: 25px;
    animation: heartFloat 5s linear infinite;
}

@keyframes heartFloat {
    from {
        transform: translateY(100vh) scale(.5);
        opacity: 0;
    }
    20% {
        opacity: 1;
    }
    to {
        transform: translateY(-100px) scale(1.3);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="stars"></div>

<!-- Bóng bay -->
<div class="balloon b1"></div>
<div class="balloon b2"></div>
<div class="balloon b3"></div>
<div class="balloon b4"></div>

<div class="container">

    <h1>🎉 HAPPY BIRTHDAY 🎉</h1>

    <!-- Đổi tên ở đây -->
    <div class="name">🎂 Nguyễn Nhân 🎂</div>

    <div class="message">
        Chúc em  tuổi mới thật vui vẻ, hạnh phúc<br>
        và luôn đạt được những điều mình mong muốn! ✨
    </div>

    <!-- Bánh -->
    <div class="cake">
        <div class="flame"></div>
        <div class="candle"></div>
        <div class="cream"></div>
        <div class="layer"></div>
    </div>

    <button onclick="birthday()">🎆 Bấm vào đây 🎆</button>

</div>

<script>

/* Tạo pháo hoa */
function createFirework() {

    const firework = document.createElement("div");
    firework.className = "firework";

    firework.style.left = Math.random() * 100 + "vw";
    firework.style.top = Math.random() * 70 + "vh";

    document.body.appendChild(firework);

    setTimeout(() => {
        firework.remove();
    }, 1500);
}

/* Pháo hoa tự động */
setInterval(createFirework, 1200);


/* Khi bấm nút */
function birthday() {

    for (let i = 0; i < 15; i++) {
        setTimeout(createFirework, i * 100);
    }

    alert("🎉 CHÚC MỪNG SINH NHẬT! 🎂🎁");
}


/* Tạo tim bay */
function createHeart() {

    const heart = document.createElement("div");

    heart.className = "heart";
    heart.innerHTML = "❤️";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration =
        (3 + Math.random() * 4) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 7000);
}

setInterval(createHeart, 600);

</script>

</body>
</html>
```
