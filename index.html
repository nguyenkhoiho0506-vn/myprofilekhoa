<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hồ Đăng Khoa | Profile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            padding: 40px 15px;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            overflow-x: hidden;
            overflow-y: auto;

            color: white;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    #4936a3 0%,
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    #28156e 0%,
                    transparent 35%
                ),
                #080812;
        }

        /* Ánh sáng nền */
        body::before {
            content: "";
            position: fixed;

            width: 500px;
            height: 500px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            border-radius: 50%;

            background: rgba(112, 76, 255, 0.13);

            filter: blur(100px);

            pointer-events: none;
            z-index: -1;
        }

        /* PROFILE */
        .profile {
            width: 430px;
            max-width: 100%;

            padding: 35px;

            text-align: center;

            background: rgba(20, 20, 38, 0.82);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border: 1px solid rgba(255,255,255,0.12);

            border-radius: 28px;

            box-shadow:
                0 25px 80px rgba(0,0,0,0.6),
                0 0 50px rgba(100,70,255,0.15);
        }

        /* AVATAR */
        .avatar-box {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .avatar {
            width: 130px;
            height: 130px;

            border-radius: 50%;

            object-fit: cover;

            border: 4px solid #8064ff;

            background: #17152d;

            box-shadow:
                0 0 20px #8064ff,
                0 0 50px rgba(128,100,255,0.45);

            transition: 0.4s ease;
        }

        .avatar:hover {
            transform: scale(1.08) rotate(3deg);

            box-shadow:
                0 0 30px #8064ff,
                0 0 70px rgba(128,100,255,0.55);
        }

        /* TÊN */
        h1 {
            margin-top: 20px;

            font-size: 30px;
            font-weight: 700;
        }

        .username {
            margin-top: 7px;

            color: #a99aff;

            font-size: 15px;
        }

        /* ONLINE */
        .online {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 8px;

            margin-top: 15px;

            color: #65ff88;

            font-size: 14px;
        }

        .dot {
            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: #65ff88;

            box-shadow:
                0 0 12px #65ff88;

            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.55;
                transform: scale(0.8);
            }
        }

        /* BIO */
        .bio {
            margin: 20px 0;

            line-height: 1.7;

            color: #c7c7d0;

            font-size: 15px;
        }

        /* STATS */
        .stats {
            display: flex;

            justify-content: space-around;

            margin: 25px 0;

            padding: 18px 0;

            border-top:
                1px solid rgba(255,255,255,0.08);

            border-bottom:
                1px solid rgba(255,255,255,0.08);
        }

        .stat {
            flex: 1;
        }

        .stat h2 {
            color: #a999ff;

            font-size: 24px;
        }

        .stat p {
            margin-top: 5px;

            color: #888894;

            font-size: 13px;
        }

        /* MUSIC */
        .music {
            margin-top: 22px;

            padding: 15px;

            background: rgba(0,0,0,0.28);

            border-radius: 18px;
        }

        .music-title {
            margin-bottom: 12px;

            font-size: 15px;

            font-weight: bold;

            color: #ddd;
        }

        iframe {
            display: block;

            width: 100%;
            height: 190px;

            border: none;

            border-radius: 14px;
        }

        /* BUTTONS */
        .buttons {
            margin-top: 22px;
        }

        .buttons a {
            display: block;

            padding: 14px;

            margin: 11px 0;

            border-radius: 13px;

            color: white;

            text-decoration: none;

            background:
                linear-gradient(
                    135deg,
                    #7658ff,
                    #6343e8
                );

            box-shadow:
                0 5px 15px rgba(100,70,255,0.2);

            transition: 0.3s ease;
        }

        .buttons a:hover {
            transform:
                translateY(-4px)
                scale(1.02);

            box-shadow:
                0 10px 25px
                rgba(100,70,255,0.45);
        }

        /* FOOTER */
        .footer {
            margin-top: 22px;

            color: #666675;

            font-size: 12px;
        }

        /* MOBILE */
        @media (max-width: 500px) {

            body {
                padding: 20px 10px;
            }

            .profile {
                padding: 25px 20px;
            }

            h1 {
                font-size: 27px;
            }

            .avatar {
                width: 115px;
                height: 115px;
            }

            iframe {
                height: 180px;
            }
        }
    </style>
</head>
